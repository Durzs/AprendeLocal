<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AprendeLocal — ¿Cómo funciona AprendeLocal?</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts: Plus Jakarta Sans & JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@600;700;800&display=swap" rel="stylesheet">
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
            mono: ['"JetBrains Mono"', 'monospace'],
          }
        }
      }
    }
  </script>

  <style>
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
      margin: 0;
      padding: 0;
    }

    /* Animación Flotante 3D Isométrica */
    @keyframes float-giant-3d {
      0%, 100% {
        transform: translateY(0px) rotate(0deg);
      }
      50% {
        transform: translateY(-12px) rotate(1deg);
      }
    }
    .floating-giant-3d {
      animation: float-giant-3d 4.5s ease-in-out infinite;
    }

    /* Radar de antena */
    @keyframes pulse-radar-ring {
      0% { transform: scale(0.9); opacity: 0.9; }
      50% { transform: scale(1.4); opacity: 0.15; }
      100% { transform: scale(0.9); opacity: 0.9; }
    }
    .radar-signal {
      animation: pulse-radar-ring 2.2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
    }

    /* Contenedor de transición cromática */
    .stage-wrapper {
      position: relative;
      overflow: hidden;
      transition: background-color 0.7s cubic-bezier(0.65, 0, 0.35, 1);
    }

    /* Animación en cascada palabra por palabra */
    .word-span {
      display: inline-block;
      opacity: 0;
      transform: translateY(16px);
      will-change: transform, opacity;
      animation: wordFadeUp 0.5s cubic-bezier(0.2, 0.9, 0.3, 1) forwards;
    }
    @keyframes wordFadeUp {
      0% {
        opacity: 0;
        transform: translateY(16px);
      }
      100% {
        opacity: 1;
        transform: translateY(0px);
      }
    }

    .desc-fade-in {
      animation: descFade 0.5s ease-out 0.2s forwards;
      opacity: 0;
    }
    @keyframes descFade {
      0% { opacity: 0; transform: translateY(10px); }
      100% { opacity: 1; transform: translateY(0px); }
    }

    /* Entrada de modelo 3D */
    .model-zoom-enter {
      animation: zoomInModel 0.65s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    @keyframes zoomInModel {
      0% {
        opacity: 0;
        transform: scale(0.94);
      }
      100% {
        opacity: 1;
        transform: scale(1);
      }
    }

    .progress-fill {
      transition: width 0.05s linear;
    }
  </style>
</head>
<body class="bg-[#0a0047] text-white">

  <!-- CONTENEDOR COMPACTO -->
  <div id="main-stage-container" class="stage-wrapper px-4 sm:px-8 lg:px-16 pt-12 sm:pt-14 pb-10 sm:pb-12 min-h-[580px] flex flex-col justify-between">
    
    <!-- HEADER SUPERIOR: TÍTULO, TIMELINE Y BOTÓN PLAY/PAUSE -->
    <header class="max-w-6xl mx-auto w-full relative z-20 mb-6 sm:mb-8">
      
      <div class="flex flex-col md:flex-row md:items-end justify-between gap-4 border-b border-white/15 pb-4">
        
        <h1 class="text-2xl sm:text-4xl font-extrabold tracking-tight text-white leading-tight">
          ¿Cómo funciona AprendeLocal?
        </h1>

        <!-- TIMELINE COMPACTO CON CÍRCULOS Y CONTROL PLAY/PAUSE -->
        <div class="flex items-center gap-3 sm:gap-5">
          <div class="flex items-center gap-3 sm:gap-4 text-xs font-bold">
            <!-- Etapa 1 -->
            <button onclick="jumpToStep(0)" class="timeline-step flex items-center gap-2 text-white font-bold transition cursor-pointer" data-step="0">
              <span class="w-7 h-7 rounded-full bg-white text-slate-950 font-extrabold flex items-center justify-center text-xs shadow-md ring-4 ring-white/20 scale-105">01</span>
              <span class="hidden sm:inline">Territorio</span>
            </button>

            <!-- Etapa 2 -->
            <button onclick="jumpToStep(1)" class="timeline-step flex items-center gap-2 text-white/50 hover:text-white font-normal transition cursor-pointer" data-step="1">
              <span class="w-7 h-7 rounded-full bg-white/15 text-white font-extrabold flex items-center justify-center text-xs">02</span>
              <span class="hidden sm:inline">Maker</span>
            </button>

            <!-- Etapa 3 -->
            <button onclick="jumpToStep(2)" class="timeline-step flex items-center gap-2 text-white/50 hover:text-white font-normal transition cursor-pointer" data-step="2">
              <span class="w-7 h-7 rounded-full bg-white/15 text-white font-extrabold flex items-center justify-center text-xs">03</span>
              <span class="hidden sm:inline">Currículum</span>
            </button>

            <!-- Etapa 4 -->
            <button onclick="jumpToStep(3)" class="timeline-step flex items-center gap-2 text-white/50 hover:text-white font-normal transition cursor-pointer" data-step="3">
              <span class="w-7 h-7 rounded-full bg-white/15 text-white font-extrabold flex items-center justify-center text-xs">04</span>
              <span class="hidden sm:inline">Comunidad</span>
            </button>
          </div>

          <!-- Botón Play/Pausa solo icono -->
          <button onclick="togglePlayback()" id="pause-icon-btn" aria-label="Pausar o Reanudar" class="w-8 h-8 rounded-full bg-white/10 hover:bg-white/20 text-white flex items-center justify-center transition cursor-pointer ml-1">
            <i id="pause-icon" data-lucide="pause" class="w-4 h-4 fill-current"></i>
          </button>
        </div>

      </div>

      <!-- Barra de progreso superior continua -->
      <div class="h-1.5 w-full bg-white/10 rounded-full mt-3 overflow-hidden">
        <div id="top-progress-bar" class="progress-fill h-full bg-orange-400 w-0"></div>
      </div>

    </header>

    <!-- CUERPO PRINCIPAL COMPACTO: TEXTO + MODELO 3D -->
    <main class="max-w-6xl mx-auto w-full my-auto grid grid-cols-1 lg:grid-cols-12 gap-6 lg:gap-12 items-center relative z-20 py-2 sm:py-4">
      
      <!-- LADO IZQUIERDO: TÍTULO Y DESCRIPCIÓN LIMPIA -->
      <div id="left-text-block" class="lg:col-span-6 space-y-4 text-left">
        
        <!-- TÍTULO EN CASCADA -->
        <h2 id="stage-title" class="text-2xl sm:text-3xl lg:text-4xl font-extrabold text-white leading-tight tracking-tight min-h-[75px] sm:min-h-[85px] flex flex-wrap items-center">
          Aprender desde el río, el bosque y la cuenca local
        </h2>

        <!-- DESCRIPCIÓN -->
        <p id="stage-desc" class="text-white/85 text-sm sm:text-base leading-relaxed max-w-lg transition-opacity duration-500">
          Transforma los ecosistemas locales y sus problemáticas socioambientales en el eje de indagación científica de tus estudiantes, fomentando pertenencia e identidad territorial.
        </p>

      </div>

      <!-- LADO DERECHO: MODELO 3D ISOMÉTRICO -->
      <div class="lg:col-span-6 flex justify-center items-center">
        <div class="w-full max-w-[420px] aspect-square flex items-center justify-center relative">
          <div id="stage-3d-model-wrapper" class="w-full h-full flex items-center justify-center floating-giant-3d model-zoom-enter">
            <!-- Modelo 3D inyectado dinámicamente -->
          </div>
        </div>
      </div>

    </main>

    <div class="h-2"></div>
  </div>

  <!-- SCRIPT -->
  <script>
    const stages = [
      {
        id: 0,
        name: "Territorio",
        bgColor: "#0a0047", // 1. Azul Marino Profundo
        title: "Aprender desde el río, el bosque y la cuenca local",
        desc: "Transforma los ecosistemas locales y sus problemáticas socioambientales en el eje de indagación científica de tus estudiantes, fomentando pertenencia e identidad territorial.",
        render3D: () => `
          <svg class="w-full h-full max-w-[390px] max-h-[350px] drop-shadow-2xl" viewBox="0 0 280 280" fill="none" xmlns="http://www.w3.org/2000/svg">
            <polygon points="140,40 240,95 140,150 40,95" fill="#34d399" stroke="#6ee7b7" stroke-width="1.5" />
            <polygon points="40,95 140,150 140,225 40,170" fill="#059669" />
            <polygon points="140,150 240,95 240,170 140,225" fill="#047857" />

            <polygon points="105,62 160,92 140,150 110,133" fill="#38bdf8" />
            <polygon points="110,133 140,150 140,225 110,208" fill="#0284c7" />

            <rect x="72" y="65" width="8" height="20" fill="#78350f" />
            <polygon points="76,35 95,65 57,65" fill="#10b981" />
            <polygon points="76,48 91,72 61,72" fill="#059669" />

            <rect x="187" y="90" width="8" height="20" fill="#78350f" />
            <polygon points="191,60 210,90 172,90" fill="#10b981" />
            <polygon points="191,73 206,97 176,97" fill="#059669" />

            <g transform="translate(150, 105)">
              <rect x="0" y="0" width="22" height="22" fill="#f59e0b" stroke="#ea580c" stroke-width="2.5" rx="3" />
              <line x1="11" y1="0" x2="11" y2="-20" stroke="#ef4444" stroke-width="3.5" stroke-linecap="round" />
              <circle cx="11" cy="-23" r="5.5" fill="#ef4444" />
              <circle cx="11" cy="-23" r="14" stroke="#ef4444" stroke-width="2" fill="none" opacity="0.6" class="radar-signal" />
            </g>
          </svg>
        `
      },
      {
        id: 1,
        name: "Maker",
        bgColor: "#ea580c", // 2. Naranja Terracota Marca
        title: "Sensores e instrumentos de bajo costo construibles en el aula",
        desc: "Dispositivos accesibles para medir pH, turbidez, temperatura y clima que los estudiantes arman y calibran con sus manos sin depender de presupuestos elevados.",
        render3D: () => `
          <svg class="w-full h-full max-w-[390px] max-h-[350px] drop-shadow-2xl" viewBox="0 0 280 280" fill="none" xmlns="http://www.w3.org/2000/svg">
            <polygon points="140,40 235,95 140,150 45,95" fill="#ffffff" stroke="#f1f5f9" stroke-width="1.5" />
            <polygon points="45,95 140,150 140,215 45,160" fill="#cbd5e1" />
            <polygon points="140,150 235,95 235,160 140,215" fill="#94a3b8" />

            <polygon points="140,65 195,95 140,125 85,95" fill="#0f172a" stroke="#334155" stroke-width="2" />
            <text x="140" y="101" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="800" fill="#4ade80" text-anchor="middle">pH: 7.2</text>

            <circle cx="185" cy="72" r="6" fill="#22c55e" stroke="#16a34a" stroke-width="1.5" />

            <path d="M140,175 C140,225 160,235 200,235" stroke="#f59e0b" stroke-width="8" fill="none" stroke-linecap="round" />
            <rect x="200" y="225" width="28" height="18" rx="5" fill="#38bdf8" stroke="#0284c7" stroke-width="2" />
          </svg>
        `
      },
      {
        id: 2,
        name: "Currículum",
        bgColor: "#1d4ed8", // 3. Azul Cobalto Vibrante
        title: "Secuencias de 4 clases con objetivos curriculares listos",
        desc: "Unidades didácticas completas alineadas a las bases curriculares oficiales de ciencias, con preguntas de indagación, hojas de terreno y rúbricas formativas.",
        render3D: () => `
          <svg class="w-full h-full max-w-[390px] max-h-[350px] drop-shadow-2xl" viewBox="0 0 280 280" fill="none" xmlns="http://www.w3.org/2000/svg">
            <polygon points="140,45 240,100 140,155 40,100" fill="#0a0047" stroke="#3b82f6" stroke-width="2" />
            <polygon points="40,100 140,155 140,205 40,150" fill="#050024" />
            <polygon points="140,155 240,100 240,150 140,205" fill="#140066" />

            <polygon points="140,20 220,65 140,115 60,65" fill="#ffffff" stroke="#2563eb" stroke-width="2.5" />
            <line x1="95" y1="62" x2="185" y2="62" stroke="#cbd5e1" stroke-width="2.5" />
            <line x1="90" y1="75" x2="190" y2="75" stroke="#cbd5e1" stroke-width="2.5" />
            <line x1="90" y1="88" x2="165" y2="88" stroke="#f97316" stroke-width="3.5" stroke-linecap="round" />

            <g transform="translate(190, 40)">
              <circle cx="0" cy="0" r="16" fill="#22c55e" stroke="#ffffff" stroke-width="2.5" />
              <polyline points="-5,-1 -1,4 6,-5" stroke="#ffffff" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" />
            </g>

            <g transform="translate(50, 115) rotate(-28)">
              <rect x="0" y="0" width="10" height="52" rx="3" fill="#f97316" />
              <polygon points="0,52 10,52 5,62" fill="#78350f" />
            </g>
          </svg>
        `
      },
      {
        id: 3,
        name: "Comunidad",
        bgColor: "#c2410c", // 4. Naranja Ámbar Cálido Profundo
        title: "Los datos recopilados generan impacto real en el territorio",
        desc: "Los hallazgos de los estudiantes no quedan archivados: se entregan formalmente al Comité de Agua Potable Rural (APR), familias y escuela para la toma de decisiones.",
        render3D: () => `
          <svg class="w-full h-full max-w-[390px] max-h-[350px] drop-shadow-2xl" viewBox="0 0 280 280" fill="none" xmlns="http://www.w3.org/2000/svg">
            <polygon points="140,55 235,110 140,165 45,110" fill="#3b82f6" stroke="#60a5fa" stroke-width="1.5" />
            <polygon points="45,110 140,165 140,220 45,165" fill="#1d4ed8" />
            <polygon points="140,165 235,110 235,165 140,220" fill="#1e40af" />

            <polygon points="140,20 185,45 140,70 95,45" fill="#fbbf24" stroke="#f59e0b" stroke-width="2" />
            <polygon points="95,45 140,70 140,115 95,90" fill="#f59e0b" />
            <polygon points="140,70 185,45 185,90 140,115" fill="#d97706" />

            <circle cx="140,45" r="8" fill="#38bdf8" />

            <circle cx="78" cy="90" r="13" fill="#f97316" stroke="#ffffff" stroke-width="2" />
            <circle cx="202" cy="90" r="13" fill="#10b981" stroke="#ffffff" stroke-width="2" />

            <g transform="translate(75, 170)">
              <rect x="0" y="0" width="130" height="28" rx="8" fill="#0a0047" stroke="#f97316" stroke-width="2" />
              <text x="65" y="19" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="800" text-anchor="middle">🤝 COMITÉ APR</text>
            </g>
          </svg>
        `
      }
    ];

    let currentStep = 0;
    let isPaused = false;
    const stepDuration = 4500; // 4.5s
    const tickInterval = 50; // ms
    let elapsed = 0;
    let timer = null;

    function renderWordCascade(titleText, descText) {
      const titleEl = document.getElementById('stage-title');
      const descEl = document.getElementById('stage-desc');

      const words = titleText.split(' ');
      titleEl.innerHTML = words.map((w, i) => `
        <span class="word-span mr-2 sm:mr-2.5" style="animation-delay: ${i * 0.045}s">
          ${w}
        </span>
      `).join('');

      descEl.className = "text-white/85 text-sm sm:text-base leading-relaxed max-w-lg desc-fade-in";
      descEl.innerText = descText;
    }

    function applyStage(index) {
      currentStep = index;
      const data = stages[currentStep];
      const stageContainer = document.getElementById('main-stage-container');

      stageContainer.style.backgroundColor = data.bgColor;

      // Modelo 3D
      const modelBlock = document.getElementById('stage-3d-model-wrapper');
      modelBlock.classList.remove('model-zoom-enter');
      void modelBlock.offsetWidth;
      modelBlock.classList.add('model-zoom-enter');
      modelBlock.innerHTML = data.render3D();

      // Render Cascada de Palabras
      renderWordCascade(data.title, data.desc);

      // Timeline Superior con círculos
      document.querySelectorAll('.timeline-step').forEach((btn, i) => {
        const badge = btn.querySelector('span:first-child');
        if (i === currentStep) {
          btn.className = "timeline-step flex items-center gap-2 text-white font-bold transition cursor-pointer";
          badge.className = "w-7 h-7 rounded-full bg-white text-slate-950 font-extrabold flex items-center justify-center text-xs shadow-md ring-4 ring-white/20 scale-105";
        } else {
          btn.className = "timeline-step flex items-center gap-2 text-white/50 hover:text-white font-normal transition cursor-pointer";
          badge.className = "w-7 h-7 rounded-full bg-white/15 text-white font-extrabold flex items-center justify-center text-xs";
        }
      });
    }

    function startAutoLoop() {
      if (timer) clearInterval(timer);

      timer = setInterval(() => {
        if (isPaused) return;

        elapsed += tickInterval;
        const progress = (elapsed / stepDuration) * 100;
        const bar = document.getElementById('top-progress-bar');
        if (bar) bar.style.width = `${progress}%`;

        if (elapsed >= stepDuration) {
          elapsed = 0;
          currentStep = (currentStep + 1) % stages.length;
          applyStage(currentStep);
        }
      }, tickInterval);
    }

    function jumpToStep(index) {
      elapsed = 0;
      applyStage(index);
    }

    function togglePlayback() {
      isPaused = !isPaused;
      const icon = document.getElementById('pause-icon');
      if (icon) {
        icon.setAttribute('data-lucide', isPaused ? 'play' : 'pause');
        lucide.createIcons();
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      applyStage(0);
      startAutoLoop();
      lucide.createIcons();
    });
  </script>
</body>
</html>
