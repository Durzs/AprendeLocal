name: Deploy frontend a GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Permisos que exige la acción oficial de Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Evita que dos despliegues simultáneos se pisen.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json

      - run: npm ci

      - run: npm run build
        env:
          # Vite incrusta estos valores en el bundle durante el build,
          # así que deben existir aquí y no en tiempo de ejecución.
          # Se configuran en Settings → Secrets and variables → Actions.
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
          VITE_API_URL: ${{ vars.VITE_API_URL }}

      # GitHub Pages no soporta rewrites, así que una recarga en
      # /cursos devolvería 404. Servir el index como página de error
      # deja que react-router resuelva la ruta en el cliente.
      - run: cp dist/index.html dist/404.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: src/frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
