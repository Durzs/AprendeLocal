name: Desplegar Edge Functions

# La generación de secuencias vivió meses sin funcionar porque la función
# estaba en el repositorio y nunca en el proyecto: desplegarla era un paso
# manual que nadie ejecutaba y que no dejaba rastro en el código. Este flujo
# lo hace automático, para que «está en main» signifique «está en línea».

on:
  push:
    branches: [main]
    paths:
      - "supabase/functions/**"
      - ".github/workflows/desplegar-funciones.yml"
  # Permite volver a desplegar sin tener que tocar la función.
  workflow_dispatch:

jobs:
  desplegar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      # Las funciones van nombradas una por una. `enviar-ruta` estuvo en main
      # sin desplegarse porque aquí solo figuraba la primera: el demo del
      # stand pedía el número a una función que no existía. Una función nueva
      # se agrega a esta lista en el mismo PR que la crea.
      - name: Desplegar las funciones
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$PROJECT_REF" ]; then
            echo "Faltan los secretos SUPABASE_ACCESS_TOKEN o SUPABASE_PROJECT_REF."
            echo "Se configuran en Settings → Secrets and variables → Actions."
            exit 1
          fi

          # El token de cuenta y las claves del proyecto se confunden con
          # facilidad: el panel las muestra en secciones parecidas, pero solo
          # una sirve para desplegar. La CLI responde a eso con «Invalid access
          # token format», que no dice cuál de los tres secretos está mal.
          case "$SUPABASE_ACCESS_TOKEN" in
            sbp_*) ;;
            eyJ*)
              echo "SUPABASE_ACCESS_TOKEN contiene una clave del proyecto (empieza por «eyJ»),"
              echo "no un token de cuenta. El correcto empieza por «sbp_» y se genera en"
              echo "supabase.com/dashboard → Account settings → Access Tokens."
              exit 1 ;;
            *)
              echo "SUPABASE_ACCESS_TOKEN no parece un token de acceso personal:"
              echo "debe empezar por «sbp_». Se genera en supabase.com/dashboard →"
              echo "Account settings → Access Tokens."
              exit 1 ;;
          esac

          case "$PROJECT_REF" in
            sbp_*|eyJ*)
              echo "SUPABASE_PROJECT_REF parece una clave, no la referencia del proyecto."
              echo "Es la cadena que aparece en la URL del panel, después de /project/."
              exit 1 ;;
          esac
          for funcion in generar-secuencia enviar-ruta; do
            supabase functions deploy "$funcion" --project-ref "$PROJECT_REF" --no-verify-jwt
          done

      - name: Comprobar que responde
        env:
          PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          # Un despliegue correcto no garantiza una función que funcione: si
          # falta ANTHROPIC_API_KEY responde 503. Se prefiere enterarse aquí y
          # no delante de un curso.
          if [ -z "$ANON_KEY" ]; then
            echo "Sin SUPABASE_ANON_KEY no se puede comprobar; se omite."
            exit 0
          fi
          codigo=$(curl -s -o /tmp/respuesta.json -w "%{http_code}" \
            -X POST "https://$PROJECT_REF.supabase.co/functions/v1/generar-secuencia" \
            -H "Authorization: Bearer $ANON_KEY" \
            -H "Content-Type: application/json" \
            -d '{}')
          echo "HTTP $codigo"
          cat /tmp/respuesta.json
          echo
          # 400 es la respuesta correcta a un cuerpo vacío: la función está viva
          # y validando. 404 significaría que no se desplegó; 503, que le falta
          # la clave de Anthropic.
          if [ "$codigo" = "400" ]; then
            echo "La función está desplegada y respondiendo."
          elif [ "$codigo" = "503" ]; then
            echo "Desplegada, pero le falta ANTHROPIC_API_KEY en los secretos del proyecto."
            exit 1
          else
            echo "Respuesta inesperada: revisar."
            exit 1
          fi

      - name: Comprobar enviar-ruta
        env:
          PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          # Un cuerpo vacío no llega a tocar la base ni a mandar nada: la
          # función lo rechaza con 400 por falta de correo. 404 es que no se
          # desplegó, que es justo lo que pasó la primera vez.
          if [ -z "$ANON_KEY" ]; then
            echo "Sin SUPABASE_ANON_KEY no se puede comprobar; se omite."
            exit 0
          fi
          codigo=$(curl -s -o /tmp/respuesta.json -w "%{http_code}" \
            -X POST "https://$PROJECT_REF.supabase.co/functions/v1/enviar-ruta" \
            -H "Authorization: Bearer $ANON_KEY" \
            -H "Content-Type: application/json" \
            -d '{}')
          echo "HTTP $codigo"
          cat /tmp/respuesta.json
          echo
          if [ "$codigo" = "400" ]; then
            echo "enviar-ruta está desplegada y respondiendo."
            echo "Para que salgan los correos faltan RESEND_API_KEY y CORREO_REMITENTE en los secretos del proyecto (ver docs/congreso.md)."
          else
            echo "Respuesta inesperada de enviar-ruta: revisar."
            exit 1
          fi
