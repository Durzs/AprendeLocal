<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!--
      Lo que se ve cuando alguien pega el enlace en otra parte.

      Antes aquí había un <title> y nada más: ni descripción, ni Open Graph,
      ni tarjeta de Twitter. Pegado en WhatsApp, en LinkedIn o en un correo,
      el enlace salía sin imagen, sin descripción y con el título pelado.
      Ahora que el sitio va a circular, eso es lo primero que ve alguien a
      quien se lo recomiendan.

      La descripción no se inventó para esto: ya estaba escrita en el
      manifest de la aplicación, y es la misma idea.
    -->
    <title>AprendeLocal · Ciencias con el lugar donde está tu escuela</title>
    <meta
      name="description"
      content="Proyectos de ciencias de tres semanas armados con el lugar donde está tu escuela. Para salas rurales multigrado: las clases escritas, la hoja de terreno y todo listo para imprimir."
    />
    <link rel="canonical" href="https://aprendelocal.cl/" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="AprendeLocal" />
    <meta property="og:locale" content="es_CL" />
    <meta property="og:url" content="https://aprendelocal.cl/" />
    <meta
      property="og:title"
      content="AprendeLocal · Ciencias con el lugar donde está tu escuela"
    />
    <meta
      property="og:description"
      content="Proyectos de ciencias de tres semanas armados con el lugar donde está tu escuela. Para salas rurales multigrado."
    />
    <meta property="og:image" content="https://aprendelocal.cl/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="AprendeLocal: proyectos de ciencias con el lugar donde está tu escuela."
    />

    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="AprendeLocal · Ciencias con el lugar donde está tu escuela"
    />
    <meta
      name="twitter:description"
      content="Proyectos de ciencias de tres semanas armados con el lugar donde está tu escuela. Para salas rurales multigrado."
    />
    <meta name="twitter:image" content="https://aprendelocal.cl/og.png" />

    <meta name="theme-color" content="#0a0047" />
    <script>
      /*
        Red de seguridad previa al bundle.

        main.tsx tiene su propio try/catch y una ErrorBoundary, pero ninguno
        de los dos puede actuar si el fallo ocurre *antes*: que el bundle no
        cargue, que no compile, o que lance al importarse. En esos casos la
        página quedaba en blanco y muda. Esto la hace hablar.
      */
      (function () {
        var errores = [];
        var pintado = false;

        function estilo(nodo, css) {
          nodo.setAttribute("style", css);
          return nodo;
        }

        function pintar(titulo, detalle) {
          var raiz = document.getElementById("root");
          if (pintado || !raiz || raiz.childNodes.length > 0) return;
          pintado = true;

          estilo(
            raiz,
            "min-height:100vh;display:flex;align-items:center;justify-content:center;" +
              "padding:24px;background:#0f172a;color:#e2e8f0;" +
              "font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif"
          );

          var caja = estilo(
            document.createElement("main"),
            "max-width:720px;line-height:1.6;width:100%"
          );

          var h1 = estilo(
            document.createElement("h1"),
            "font-size:1.5rem;margin:0 0 12px"
          );
          h1.textContent = titulo;

          var intro = estilo(
            document.createElement("p"),
            "margin:0 0 20px;color:#94a3b8"
          );
          intro.textContent = "Este es el fallo registrado:";

          var pre = estilo(
            document.createElement("pre"),
            "margin:0 0 20px;padding:16px;background:#1e293b;border-radius:8px;" +
              "font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.85rem;" +
              "white-space:pre-wrap;word-break:break-word"
          );
          pre.textContent = detalle;

          var ayuda = estilo(
            document.createElement("p"),
            "margin:0;font-size:.9rem;color:#94a3b8"
          );
          ayuda.textContent =
            "Si acabas de redesplegar, recarga vaciando la caché (Ctrl+Shift+R).";

          caja.appendChild(h1);
          caja.appendChild(intro);
          caja.appendChild(pre);
          caja.appendChild(ayuda);
          raiz.appendChild(caja);
        }

        // En captura, para enterarse también de los recursos que no cargan.
        window.addEventListener(
          "error",
          function (evento) {
            var detalle;
            var destino = evento.target;

            if (destino && destino !== window && (destino.src || destino.href)) {
              detalle =
                "No se pudo cargar el recurso:\n" + (destino.src || destino.href);
            } else {
              detalle = evento.message || "error desconocido";
              if (evento.filename) {
                detalle +=
                  "\n" +
                  evento.filename +
                  ":" +
                  evento.lineno +
                  ":" +
                  evento.colno;
              }
            }

            errores.push(detalle);
            pintar("AprendeLocal no pudo arrancar", detalle);
          },
          true
        );

        window.addEventListener("unhandledrejection", function (evento) {
          var motivo = evento.reason;
          var detalle =
            (motivo && (motivo.stack || motivo.message)) || String(motivo);
          errores.push(detalle);
          pintar("AprendeLocal no pudo arrancar", detalle);
        });

        // Si pasado un margen razonable no se montó nada y tampoco hubo
        // ningún error, lo más probable es una versión cacheada obsoleta.
        window.addEventListener("load", function () {
          setTimeout(function () {
            pintar(
              "AprendeLocal no llegó a montar",
              errores.length
                ? errores.join("\n\n")
                : "No se registró ningún error de JavaScript.\n\n" +
                    "Suele significar que el navegador está sirviendo una versión " +
                    "cacheada que ya no existe en el servidor. Recarga con " +
                    "Ctrl+Shift+R, o borra los datos del sitio y vuelve a entrar."
            );
          }, 8000);
        });
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
