<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AprendeLocal — Propuestas Visuales para Crear Ruta</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800;900&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,600;0,6..72,700;1,6..72,400&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    .font-editorial {
      font-family: 'Newsreader', serif;
    }
    .font-tech {
      font-family: 'Space Grotesk', sans-serif;
    }
    .slide-enter-right {
      animation: slideInRight 0.35s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    .slide-enter-left {
      animation: slideInLeft 0.35s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    @keyframes slideInRight {
      from { opacity: 0; transform: translateX(24px); }
      to { opacity: 1; transform: translateX(0); }
    }
    @keyframes slideInLeft {
      from { opacity: 0; transform: translateX(-24px); }
      to { opacity: 1; transform: translateX(0); }
    }
  </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col">

  <!-- ========================================================================= -->
  <!-- BARRA SUPERIOR FLOTANTE DE CONTROL DE PROPUESTAS                          -->
  <!-- ========================================================================= -->
  <header class="sticky top-0 z-50 bg-slate-950/90 backdrop-blur-md border-b border-slate-800 px-4 py-3 text-white shadow-xl">
    <div class="max-w-7xl mx-auto flex flex-col sm:flex-row items-center justify-between gap-3">
      
      <div class="flex items-center gap-3">
        <div class="flex items-center gap-2">
          <span class="w-2.5 h-2.5 rounded-full bg-[#f97316] animate-pulse"></span>
          <span class="text-xs uppercase tracking-widest font-bold text-slate-400">Diseño / Crear Ruta</span>
        </div>
        <span class="text-slate-700">|</span>
        <span class="text-xs text-slate-300 font-medium">Borradores Visuales Interactivos</span>
      </div>

      <!-- Selector de Temas / Propuestas -->
      <div class="inline-flex p-1 bg-slate-800/90 rounded-2xl border border-slate-700 gap-1 text-xs">
        <button onclick="setProposal('light')" id="btn-theme-light" class="px-3.5 py-1.5 rounded-xl font-bold transition flex items-center gap-1.5 bg-[#0a0047] text-white shadow">
          <span>✨ 1. Studio STEM</span>
          <span class="hidden md:inline text-[10px] text-orange-300 font-normal">(Limpio & Moderno)</span>
        </button>

        <button onclick="setProposal('natural')" id="btn-theme-natural" class="px-3.5 py-1.5 rounded-xl font-medium transition flex items-center gap-1.5 text-slate-400 hover:text-white">
          <span>🌿 2. Cuaderno Botánico</span>
          <span class="hidden md:inline text-[10px] text-emerald-400 font-normal">(Naturalista / Editorial)</span>
        </button>

        <button onclick="setProposal('midnight')" id="btn-theme-midnight" class="px-3.5 py-1.5 rounded-xl font-medium transition flex items-center gap-1.5 text-slate-400 hover:text-white">
          <span>🚀 3. Laboratorio Pro</span>
          <span class="hidden md:inline text-[10px] text-cyan-300 font-normal">(Panel Dividido 50/50)</span>
        </button>
      </div>

      <div class="text-xs text-slate-400 hidden lg:block font-mono">
        Atajos: <kbd class="px-1.5 py-0.5 bg-slate-800 rounded border border-slate-700 text-slate-300">←</kbd> <kbd class="px-1.5 py-0.5 bg-slate-800 rounded border border-slate-700 text-slate-300">→</kbd>
      </div>

    </div>
  </header>

  <!-- CONTENEDOR PRINCIPAL -->
  <main id="app-container" class="flex-1 flex flex-col relative overflow-hidden">
  </main>

  <script>
    const state = {
      theme: 'light',
      step: 0,
      docente: 'Rayen Millán',
      estudiantes: 14,
      cursos: ['5º', '6º'],
      semanas: 3,
      evaluacion: 'cuaderno',
      oa: 'OA 01: Investigar experimentalmente y explicar la importancia del agua limpia en los ecosistemas locales.',
      entorno: 'rio',
      ubicacion: 'Río Cautín, sector Curarrehue',
      fenomeno: 'El río presenta aumento de turbidez y acumulación de sedimentos tras las primeras lluvias.',
      preguntaGuia: '¿Cómo cambia la calidad y transparencia del agua de nuestro estero entre el invierno y la primavera?',
      preguntasSugeridas: [
        '¿Cómo cambia la calidad y transparencia del agua de nuestro estero entre el invierno y la primavera?',
        '¿Qué macroinvertebrados bioindicadores viven en el río cercano a nuestra escuela?',
        '¿Cómo influye la vegetación nativa de la ribera en la salud del suelo y el agua?'
      ]
    };

    const stepsMeta = [
      { id: 'programa', num: '01', titulo: 'Lo que pide el programa', subtitulo: 'Cursos, tiempos y objetivos curriculares' },
      { id: 'lugar', num: '02', titulo: 'Lo que pone el territorio', subtitulo: 'El entorno natural y qué fenómeno ocurre ahí' },
      { id: 'preguntas', num: '03', titulo: 'La pregunta central', subtitulo: 'La indagación que sostendrá las 3 o 4 semanas' },
      { id: 'ruta', num: '04', titulo: 'La ruta armada', subtitulo: 'Plan clase a clase, materiales y biodiversidad' }
    ];

    function setProposal(themeName) {
      state.theme = themeName;
      ['light', 'natural', 'midnight'].forEach(t => {
        const btn = document.getElementById(`btn-theme-${t}`);
        if (t === themeName) {
          btn.className = 'px-3.5 py-1.5 rounded-xl font-bold transition flex items-center gap-1.5 bg-[#0a0047] text-white shadow border border-white/20';
        } else {
          btn.className = 'px-3.5 py-1.5 rounded-xl font-medium transition flex items-center gap-1.5 text-slate-400 hover:text-white';
        }
      });
      render();
    }

    function goToStep(idx) {
      if (idx < 0 || idx >= stepsMeta.length) return;
      state.step = idx;
      render();
    }

    function toggleCurso(c) {
      if (state.cursos.includes(c)) {
        state.cursos = state.cursos.filter(x => x !== c);
      } else {
        state.cursos.push(c);
      }
      render();
    }

    function setEntorno(ent) {
      state.entorno = ent;
      render();
    }

    function setEvaluacion(ev) {
      state.evaluacion = ev;
      render();
    }

    function setPregunta(p) {
      state.preguntaGuia = p;
      render();
    }

    window.addEventListener('keydown', (e) => {
      const tag = document.activeElement?.tagName;
      if (tag === 'INPUT' || tag === 'TEXTAREA') return;
      if (e.key === 'ArrowRight') goToStep(state.step + 1);
      if (e.key === 'ArrowLeft') goToStep(state.step - 1);
    });

    function render() {
      const container = document.getElementById('app-container');
      if (state.theme === 'light') {
        renderThemeLight(container);
      } else if (state.theme === 'natural') {
        renderThemeNatural(container);
      } else if (state.theme === 'midnight') {
        renderThemeMidnight(container);
      }
      lucide.createIcons();
    }

    function renderThemeLight(container) {
      container.className = "flex-1 flex flex-col bg-[#f8fafc] text-slate-900";
      const currentMeta = stepsMeta[state.step];

      container.innerHTML = `
        <div class="w-full max-w-6xl mx-auto px-4 sm:px-6 py-6 sm:py-8 flex-1 flex flex-col justify-between">
          <div class="mb-8">
            <div class="flex items-center justify-between pb-4 border-b border-slate-200">
              <div class="flex items-center gap-3">
                <div class="w-9 h-9 rounded-2xl bg-[#0a0047] text-white flex items-center justify-center font-bold text-sm shadow-md">
                  ${currentMeta.num}
                </div>
                <div>
                  <h1 class="text-xl sm:text-2xl font-extrabold text-[#0a0047] tracking-tight">
                    ${currentMeta.titulo}
                  </h1>
                  <p class="text-xs sm:text-sm text-slate-500 font-medium">
                    ${currentMeta.subtitulo}
                  </p>
                </div>
              </div>

              <div class="flex items-center gap-2 text-xs font-semibold text-emerald-700 bg-emerald-50 border border-emerald-200/80 px-3.5 py-1.5 rounded-full shadow-xs">
                <span class="w-2 h-2 rounded-full bg-emerald-500 animate-ping"></span>
                <span>Guardado automático</span>
              </div>
            </div>

            <div class="grid grid-cols-4 gap-2 sm:gap-4 mt-4">
              ${stepsMeta.map((s, idx) => `
                <button onclick="goToStep(${idx})" class="group flex flex-col gap-1.5 text-left cursor-pointer transition">
                  <div class="h-2 w-full rounded-full transition-all duration-300 ${
                    idx < state.step ? 'bg-emerald-500' : (idx === state.step ? 'bg-[#f97316]' : 'bg-slate-200 group-hover:bg-slate-300')
                  }"></div>
                  <div class="flex items-center justify-between text-[11px] font-bold ${
                    idx === state.step ? 'text-[#0a0047]' : (idx < state.step ? 'text-emerald-700' : 'text-slate-400')
                  }">
                    <span class="hidden sm:inline">${s.num}. ${s.titulo}</span>
                    <span class="sm:hidden">${s.num}</span>
                    ${idx < state.step ? '<i data-lucide="check" class="w-3.5 h-3.5 text-emerald-600"></i>' : ''}
                  </div>
                </button>
              `).join('')}
            </div>
          </div>

          <div class="bg-white rounded-3xl border border-slate-200/90 p-6 sm:p-10 shadow-xl shadow-slate-200/50 slide-enter-right flex-1 my-auto">
            ${getStepContentHtml('light')}
          </div>

          <div class="mt-8 flex items-center justify-between pt-4 border-t border-slate-200">
            <button onclick="goToStep(state.step - 1)" ${state.step === 0 ? 'disabled' : ''} class="px-5 py-2.5 rounded-full border border-slate-300 bg-white hover:bg-slate-50 text-slate-700 font-bold text-sm transition disabled:opacity-30 disabled:cursor-not-allowed flex items-center gap-2 cursor-pointer shadow-xs">
              <i data-lucide="arrow-left" class="w-4 h-4"></i>
              <span>Anterior</span>
            </button>

            <div class="text-xs font-semibold text-slate-400">
              Paso ${state.step + 1} de 4
            </div>

            <button onclick="goToStep(state.step + 1)" ${state.step === 3 ? 'disabled' : ''} class="px-7 py-2.5 rounded-full bg-[#0a0047] hover:bg-[#15007a] text-white font-bold text-sm shadow-md shadow-[#0a0047]/20 transition flex items-center gap-2 cursor-pointer hover:-translate-y-0.5 disabled:opacity-40 disabled:cursor-not-allowed">
              <span>${state.step === 3 ? 'Finalizar Expedición' : 'Siguiente Paso'}</span>
              <i data-lucide="arrow-right" class="w-4 h-4 text-amber-300"></i>
            </button>
          </div>
        </div>
      `;
    }

    function renderThemeNatural(container) {
      container.className = "flex-1 flex flex-col bg-[#faf7f2] text-[#24332c]";
      const currentMeta = stepsMeta[state.step];

      container.innerHTML = `
        <div class="w-full max-w-5xl mx-auto px-5 sm:px-8 py-8 flex-1 flex flex-col justify-between" style="background-image: radial-gradient(#d6cebe 0.75px, transparent 0.75px); background-size: 16px 16px;">
          <div class="mb-6 flex flex-col sm:flex-row sm:items-end justify-between gap-4 border-b-2 border-[#d9d0c1] pb-4">
            <div>
              <div class="flex items-center gap-2 text-[11px] font-mono uppercase tracking-[0.2em] text-[#718579] font-bold">
                <span>Cuaderno de Campo Territorial</span>
                <span>·</span>
                <span>Ficha ${currentMeta.num} / 04</span>
              </div>
              <h1 class="text-2xl sm:text-3xl font-editorial font-bold text-[#1a2d24] mt-1 tracking-tight">
                ${currentMeta.titulo}
              </h1>
            </div>

            <div class="flex items-center gap-1.5 bg-[#eae2d3] p-1.5 rounded-2xl border border-[#d6cbba]">
              ${stepsMeta.map((s, idx) => `
                <button onclick="goToStep(${idx})" class="px-3.5 py-1.5 rounded-xl font-bold text-xs transition cursor-pointer ${
                  idx === state.step 
                    ? 'bg-[#2d4a3e] text-[#f7f4ed] shadow-md' 
                    : (idx < state.step ? 'bg-[#dfd5c4] text-[#1a2d24]' : 'text-[#7d7261] hover:text-[#1a2d24]')
                }">
                  ${s.num} ${idx < state.step ? '✓' : ''}
                </button>
              `).join('')}
            </div>
          </div>

          <div class="bg-white rounded-2xl border-2 border-[#e3dac9] p-6 sm:p-10 shadow-lg relative overflow-hidden slide-enter-right my-auto">
            <div class="absolute -top-3 -right-3 w-24 h-24 rounded-full border-2 border-dashed border-[#c25e1a]/30 flex items-center justify-center rotate-12 pointer-events-none">
              <span class="text-[9px] font-mono uppercase tracking-widest text-[#c25e1a]/60 text-center leading-tight">APRENDELOCAL<br>TERRENO</span>
            </div>
            ${getStepContentHtml('natural')}
          </div>

          <div class="mt-6 flex items-center justify-between pt-4 border-t-2 border-[#d9d0c1]">
            <button onclick="goToStep(state.step - 1)" ${state.step === 0 ? 'disabled' : ''} class="px-6 py-2.5 rounded-xl border border-[#c9beab] bg-[#f2ecdf] hover:bg-[#eae2d3] text-[#2c3d34] font-bold text-sm transition cursor-pointer disabled:opacity-30">
              ← Lámina anterior
            </button>
            <span class="font-editorial italic text-sm text-[#7a6f5d]">
              Guardado en este dispositivo
            </span>
            <button onclick="goToStep(state.step + 1)" ${state.step === 3 ? 'disabled' : ''} class="px-7 py-2.5 rounded-xl bg-[#2d4a3e] hover:bg-[#1f362c] text-[#faf6ee] font-bold text-sm shadow-md transition hover:-translate-y-0.5 cursor-pointer disabled:opacity-30">
              ${state.step === 3 ? 'Completar Ruta 🌱' : 'Siguiente Lámina →'}
            </button>
          </div>
        </div>
      `;
    }

    function renderThemeMidnight(container) {
      container.className = "flex-1 flex flex-col bg-[#05060d] text-slate-100";
      const currentMeta = stepsMeta[state.step];

      container.innerHTML = `
        <div class="w-full max-w-7xl mx-auto px-4 sm:px-6 py-6 flex-1 flex flex-col justify-between">
          <div class="flex items-center justify-between pb-4 border-b border-slate-800">
            <div class="flex items-center gap-3">
              <div class="w-8 h-8 rounded-xl bg-cyan-500/20 text-cyan-400 border border-cyan-500/40 flex items-center justify-center font-tech font-bold text-sm">
                ${currentMeta.num}
              </div>
              <div>
                <h1 class="text-lg sm:text-xl font-tech font-bold text-white tracking-wide uppercase">
                  ${currentMeta.titulo}
                </h1>
                <p class="text-xs text-slate-400">
                  ${currentMeta.subtitulo}
                </p>
              </div>
            </div>

            <div class="flex items-center gap-1.5 bg-slate-900/90 p-1 rounded-full border border-slate-800">
              ${stepsMeta.map((s, idx) => `
                <button onclick="goToStep(${idx})" class="px-3 py-1 rounded-full text-xs font-mono transition cursor-pointer ${
                  idx === state.step 
                    ? 'bg-cyan-500 text-slate-950 font-bold shadow-md shadow-cyan-500/30' 
                    : (idx < state.step ? 'text-emerald-400 font-semibold' : 'text-slate-500 hover:text-slate-300')
                }">
                  0${idx + 1}
                </button>
              `).join('')}
            </div>
          </div>

          <div class="grid grid-cols-1 lg:grid-cols-12 gap-6 my-auto py-6 items-stretch">
            <div class="lg:col-span-7 bg-slate-900/70 border border-slate-800 rounded-3xl p-6 sm:p-8 backdrop-blur-xl shadow-2xl flex flex-col justify-between slide-enter-left">
              <div>
                ${getStepContentHtml('midnight')}
              </div>
            </div>

            <div class="lg:col-span-5 bg-gradient-to-b from-slate-900/90 to-blue-950/40 border border-blue-900/30 rounded-3xl p-6 backdrop-blur-xl flex flex-col justify-between relative overflow-hidden shadow-2xl">
              <div class="absolute -top-10 -right-10 w-40 h-40 bg-cyan-500/10 rounded-full blur-3xl pointer-events-none"></div>
              <div>
                <div class="flex items-center justify-between pb-3 border-b border-slate-800 mb-4">
                  <span class="text-xs font-tech font-bold uppercase tracking-wider text-cyan-400 flex items-center gap-1.5">
                    <i data-lucide="radar" class="w-4 h-4"></i>
                    <span>Radar de Expedición</span>
                  </span>
                  <span class="text-[10px] font-mono text-slate-400 bg-slate-800 px-2 py-0.5 rounded">En vivo</span>
                </div>

                <div class="space-y-3.5 text-xs">
                  <div class="bg-slate-950/60 p-3 rounded-xl border border-slate-800">
                    <span class="text-slate-500 block mb-0.5 font-mono text-[10px]">PROFESOR / GRUPO</span>
                    <span class="font-bold text-white text-sm">${state.docente || 'Sin asignar'}</span>
                    <span class="text-slate-400 ml-1 font-mono">(${state.estudiantes || 0} estudiantes · ${state.cursos.join(', ') || 'Niveles sin marcar'})</span>
                  </div>

                  <div class="bg-slate-950/60 p-3 rounded-xl border border-slate-800">
                    <span class="text-slate-500 block mb-0.5 font-mono text-[10px]">ECOSISTEMA & LOCALIDAD</span>
                    <span class="font-bold text-orange-400 text-sm capitalize">📍 ${state.entorno}</span>
                    <p class="text-slate-300 mt-1 line-clamp-2">${state.ubicacion || 'Especificar en el paso 2'}</p>
                  </div>

                  <div class="bg-slate-950/60 p-3 rounded-xl border border-slate-800">
                    <span class="text-slate-500 block mb-0.5 font-mono text-[10px]">PREGUNTA DE INVESTIGACIÓN</span>
                    <p class="text-emerald-300 font-semibold italic text-xs">"${state.preguntaGuia || 'Pendiente'}"</p>
                  </div>
                </div>
              </div>

              <div class="mt-4 pt-4 border-t border-slate-800 flex items-center justify-between text-xs text-slate-400">
                <span class="flex items-center gap-1.5">
                  <i data-lucide="activity" class="w-4 h-4 text-emerald-400"></i>
                  <span>Alineación curricular: 100%</span>
                </span>
                <span class="font-mono text-cyan-400 font-bold">4 Sesiones</span>
              </div>
            </div>
          </div>

          <div class="flex items-center justify-between pt-4 border-t border-slate-800">
            <button onclick="goToStep(state.step - 1)" ${state.step === 0 ? 'disabled' : ''} class="px-5 py-2.5 rounded-xl border border-slate-700 bg-slate-900 hover:bg-slate-800 text-slate-300 font-mono text-xs transition cursor-pointer disabled:opacity-30">
              [←] Anterior
            </button>
            <button onclick="goToStep(state.step + 1)" ${state.step === 3 ? 'disabled' : ''} class="px-7 py-2.5 rounded-xl bg-gradient-to-r from-orange-500 to-amber-500 hover:from-orange-600 hover:to-amber-600 text-slate-950 font-bold text-xs font-mono uppercase tracking-wider shadow-lg shadow-orange-500/20 transition cursor-pointer disabled:opacity-30 hover:-translate-y-0.5">
              ${state.step === 3 ? 'Lanzar Expedición 🚀' : 'Siguiente Paso [→]'}
            </button>
          </div>
        </div>
      `;
    }

    function getStepContentHtml(theme) {
      if (state.step === 0) {
        return `
          <div class="space-y-6">
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-5">
              <div>
                <label class="block text-xs font-bold uppercase tracking-wider mb-2 ${theme === 'light' ? 'text-slate-700' : (theme === 'natural' ? 'text-[#2d4a3e]' : 'text-slate-300')}">
                  Nombre del Docente
                </label>
                <input 
                  type="text" 
                  value="${state.docente}" 
                  oninput="state.docente = this.value" 
                  placeholder="Ej: Rayen Millán" 
                  class="w-full px-4 py-3 rounded-xl border text-sm transition focus:outline-none ${
                    theme === 'light' 
                      ? 'bg-slate-50 border-slate-300 text-slate-900 focus:border-[#0a0047] focus:bg-white' 
                      : (theme === 'natural' ? 'bg-[#fcfaf7] border-[#d8cebe] text-[#1a2d24] focus:border-[#2d4a3e]' : 'bg-slate-950 border-slate-800 text-white focus:border-cyan-500')
                  }"
                />
                <span class="text-[11px] mt-1 block ${theme === 'light' ? 'text-slate-500' : 'text-slate-400'}">Firma formalmente las cartas a las familias y directivos.</span>
              </div>

              <div>
                <label class="block text-xs font-bold uppercase tracking-wider mb-2 ${theme === 'light' ? 'text-slate-700' : (theme === 'natural' ? 'text-[#2d4a3e]' : 'text-slate-300')}">
                  Nº de Estudiantes
                </label>
                <input 
                  type="number" 
                  value="${state.estudiantes}" 
                  oninput="state.estudiantes = Number(this.value)" 
                  placeholder="14" 
                  class="w-full px-4 py-3 rounded-xl border text-sm transition focus:outline-none ${
                    theme === 'light' 
                      ? 'bg-slate-50 border-slate-300 text-slate-900 focus:border-[#0a0047] focus:bg-white' 
                      : (theme === 'natural' ? 'bg-[#fcfaf7] border-[#d8cebe] text-[#1a2d24] focus:border-[#2d4a3e]' : 'bg-slate-950 border-slate-800 text-white focus:border-cyan-500')
                  }"
                />
                <span class="text-[11px] mt-1 block ${theme === 'light' ? 'text-slate-500' : 'text-slate-400'}">Permite dimensionar grupos y kit de materiales.</span>
              </div>
            </div>

            <div>
              <label class="block text-xs font-bold uppercase tracking-wider mb-2 ${theme === 'light' ? 'text-slate-700' : (theme === 'natural' ? 'text-[#2d4a3e]' : 'text-slate-300')}">
                Cursos presentes en la sala (Multigrado)
              </label>
              <div class="flex flex-wrap gap-2.5">
                ${['5º', '6º', '7º', '8º'].map(c => `
                  <button 
                    type="button" 
                    onclick="toggleCurso('${c}')" 
                    class="px-5 py-2 rounded-full font-bold text-sm transition cursor-pointer border ${
                      state.cursos.includes(c)
                        ? (theme === 'light' ? 'bg-[#0a0047] text-white border-[#0a0047] shadow-sm' : (theme === 'natural' ? 'bg-[#2d4a3e] text-white border-[#2d4a3e]' : 'bg-cyan-500 text-slate-950 border-cyan-400'))
                        : (theme === 'light' ? 'bg-slate-100 text-slate-700 border-slate-200 hover:bg-slate-200' : (theme === 'natural' ? 'bg-[#f4efe4] text-[#4d5c53] border-[#ded4c3]' : 'bg-slate-950 text-slate-400 border-slate-800 hover:text-white'))
                    }"
                  >
                    ${c} Básico
                  </button>
                `).join('')}
              </div>
            </div>

            <div>
              <label class="block text-xs font-bold uppercase tracking-wider mb-2 ${theme === 'light' ? 'text-slate-700' : (theme === 'natural' ? 'text-[#2d4a3e]' : 'text-slate-300')}">
                Instrumento Principal de Evaluación
              </label>
              <div class="grid grid-cols-2 sm:grid-cols-3 gap-2.5">
                ${[
                  { id: 'cuaderno', label: 'Cuaderno de Campo' },
                  { id: 'producto', label: 'Producto Comunitario' },
                  { id: 'rubrica', label: 'Rúbrica de Criterios' },
                  { id: 'presentacion', label: 'Presentación Oral' },
                  { id: 'observacion', label: 'Pauta en Terreno' }
                ].map(ev => `
                  <button 
                    type="button" 
                    onclick="setEvaluacion('${ev.id}')" 
                    class="p-3 rounded-2xl text-left border transition cursor-pointer ${
                      state.evaluacion === ev.id
                        ? (theme === 'light' ? 'bg-orange-50 border-[#f97316] text-[#ea580c] font-bold shadow-xs' : (theme === 'natural' ? 'bg-[#f2e7d8] border-[#c25e1a] text-[#a1480f] font-bold' : 'bg-cyan-500/10 border-cyan-500 text-cyan-300 font-bold'))
                        : (theme === 'light' ? 'bg-slate-50 border-slate-200 text-slate-700 hover:bg-slate-100' : (theme === 'natural' ? 'bg-[#f8f5ee] border-[#e6ded0] text-[#3e5246]' : 'bg-slate-950 border-slate-800 text-slate-400 hover:bg-slate-900'))
                    }"
                  >
                    <span class="text-xs sm:text-sm block">${ev.label}</span>
                  </button>
                `).join('')}
              </div>
            </div>
          </div>
        `;
      }

      if (state.step === 1) {
        return `
          <div class="space-y-6">
            <div>
              <label class="block text-xs font-bold uppercase tracking-wider mb-2.5 ${theme === 'light' ? 'text-slate-700' : (theme === 'natural' ? 'text-[#2d4a3e]' : 'text-slate-300')}">
                ¿Qué tipo de entorno está más cerca de la escuela?
              </label>
              <div class="grid grid-cols-2 sm:grid-cols-3 gap-3">
                ${[
                  { id: 'rio', label: '🌊 Río o Estero', desc: 'Cuencas y cuerpos de agua' },
                  { id: 'bosque', label: '🌲 Bosque Nativo', desc: 'Araucarias, robles, sotobosque' },
                  { id: 'campo', label: '🌾 Campo o Huerta', desc: 'Cultivos, suelos y abono' },
                  { id: 'costa', label: '🏖️ Costa o Lago', desc: 'Litoral, humedales y viento' },
                  { id: 'cordillera', label: '🏔️ Cerro o Volcán', desc: 'Radiación, clima y altura' },
                  { id: 'pueblo', label: '🏡 Pueblo o Camino', desc: 'Sistemas urbanos y comunidad' }
                ].map(item => `
                  <button 
                    type="button" 
                    onclick="setEntorno('${item.id}')" 
                    class="p-4 rounded-2xl text-left border transition cursor-pointer flex flex-col justify-between ${
                      state.entorno === item.id
                        ? (theme === 'light' ? 'bg-emerald-50 border-emerald-500 text-emerald-950 ring-2 ring-emerald-400/20 shadow-sm' : (theme === 'natural' ? 'bg-[#eaf0ec] border-[#2d4a3e] text-[#193326] font-bold ring-2 ring-[#2d4a3e]/20' : 'bg-cyan-500/10 border-cyan-500 text-cyan-300 font-bold'))
                        : (theme === 'light' ? 'bg-slate-50 border-slate-200 text-slate-700 hover:bg-slate-100' : (theme === 'natural' ? 'bg-[#fbf8f2] border-[#e3d9cb] text-[#33473c]' : 'bg-slate-950 border-slate-800 text-slate-400 hover:bg-slate-900'))
                    }"
                  >
                    <span class="text-sm font-bold block mb-1">${item.label}</span>
                    <span class="text-[11px] opacity-75 leading-tight">${item.desc}</span>
                  </button>
                `).join('')}
              </div>
            </div>

            <div class="space-y-4">
              <div>
                <label class="block text-xs font-bold uppercase tracking-wider mb-1.5 ${theme === 'light' ? 'text-slate-700' : (theme === 'natural' ? 'text-[#2d4a3e]' : 'text-slate-300')}">
                  Nombre específico del lugar o sector
                </label>
                <input 
                  type="text" 
                  value="${state.ubicacion}" 
                  oninput="state.ubicacion = this.value" 
                  placeholder="Ej: Estero Pichicautín, a 200m de la escuela" 
                  class="w-full px-4 py-3 rounded-xl border text-sm transition focus:outline-none ${
                    theme === 'light' 
                      ? 'bg-slate-50 border-slate-300 text-slate-900 focus:border-[#0a0047] focus:bg-white' 
                      : (theme === 'natural' ? 'bg-[#fcfaf7] border-[#d8cebe] text-[#1a2d24] focus:border-[#2d4a3e]' : 'bg-slate-950 border-slate-800 text-white focus:border-cyan-500')
                  }"
                />
              </div>

              <div>
                <label class="block text-xs font-bold uppercase tracking-wider mb-1.5 ${theme === 'light' ? 'text-slate-700' : (theme === 'natural' ? 'text-[#2d4a3e]' : 'text-slate-300')}">
                  ¿Qué fenómeno o problemática observan los estudiantes ahí?
                </label>
                <textarea 
                  rows="3" 
                  oninput="state.fenomeno = this.value" 
                  placeholder="Ej: El agua baja más turbia en ciertas épocas..." 
                  class="w-full px-4 py-3 rounded-xl border text-sm transition focus:outline-none resize-y ${
                    theme === 'light' 
                      ? 'bg-slate-50 border-slate-300 text-slate-900 focus:border-[#0a0047] focus:bg-white' 
                      : (theme === 'natural' ? 'bg-[#fcfaf7] border-[#d8cebe] text-[#1a2d24] focus:border-[#2d4a3e]' : 'bg-slate-950 border-slate-800 text-white focus:border-cyan-500')
                  }"
                >${state.fenomeno}</textarea>
              </div>
            </div>
          </div>
        `;
      }

      if (state.step === 2) {
        return `
          <div class="space-y-6">
            <div class="p-4 rounded-2xl ${theme === 'light' ? 'bg-orange-50/70 border border-orange-200/80 text-orange-950' : (theme === 'natural' ? 'bg-[#f5ede1] border border-[#e6d8c3] text-[#783c14]' : 'bg-orange-500/10 border border-orange-500/30 text-orange-200')}">
              <span class="text-xs font-bold uppercase tracking-wider block mb-1">💡 Co-diseño de la Pregunta de Investigación</span>
              <p class="text-xs sm:text-sm leading-relaxed">
                Elige una de las propuestas formuladas a partir de tu entorno o modifícala con las palabras de tu propia escuela:
              </p>
            </div>

            <div class="space-y-3">
              ${state.preguntasSugeridas.map((preg, idx) => `
                <div 
                  onclick="setPregunta('${preg}')" 
                  class="p-4 rounded-2xl border transition cursor-pointer flex items-start gap-3.5 ${
                    state.preguntaGuia === preg
                      ? (theme === 'light' ? 'bg-[#0a0047] text-white border-[#0a0047] shadow-md' : (theme === 'natural' ? 'bg-[#2d4a3e] text-white border-[#2d4a3e]' : 'bg-cyan-500/20 border-cyan-400 text-cyan-200'))
                      : (theme === 'light' ? 'bg-slate-50 border-slate-200 text-slate-800 hover:bg-slate-100' : (theme === 'natural' ? 'bg-[#faf6ee] border-[#e8ded0] text-[#2c3d33]' : 'bg-slate-950 border-slate-800 text-slate-300 hover:bg-slate-900'))
                  }"
                >
                  <div class="w-6 h-6 rounded-full flex items-center justify-center shrink-0 mt-0.5 font-bold text-xs ${
                    state.preguntaGuia === preg ? 'bg-amber-400 text-slate-950' : 'bg-slate-200 text-slate-700'
                  }">
                    ${idx + 1}
                  </div>
                  <div class="flex-1 text-sm font-semibold leading-relaxed">
                    "${preg}"
                  </div>
                  ${state.preguntaGuia === preg ? '<i data-lucide="check-circle-2" class="w-5 h-5 text-amber-300 shrink-0"></i>' : ''}
                </div>
              `).join('')}
            </div>

            <div class="pt-2">
              <label class="block text-xs font-bold uppercase tracking-wider mb-2 ${theme === 'light' ? 'text-slate-700' : (theme === 'natural' ? 'text-[#2d4a3e]' : 'text-slate-300')}">
                O escribe/edita la pregunta final aquí:
              </label>
              <textarea 
                rows="2" 
                oninput="state.preguntaGuia = this.value" 
                class="w-full px-4 py-3 rounded-xl border text-sm font-semibold transition focus:outline-none ${
                  theme === 'light' 
                    ? 'bg-slate-50 border-slate-300 text-slate-900 focus:border-[#0a0047] focus:bg-white' 
                    : (theme === 'natural' ? 'bg-[#fcfaf7] border-[#d8cebe] text-[#1a2d24] focus:border-[#2d4a3e]' : 'bg-slate-950 border-slate-800 text-white focus:border-cyan-500')
                }"
              >${state.preguntaGuia}</textarea>
            </div>
          </div>
        `;
      }

      if (state.step === 3) {
        return `
          <div class="space-y-6">
            <div class="flex items-center gap-3 p-4 rounded-2xl ${theme === 'light' ? 'bg-emerald-50 border border-emerald-200 text-emerald-950' : (theme === 'natural' ? 'bg-[#edf5ef] border border-[#cfdfd2] text-[#193822]' : 'bg-emerald-500/10 border border-emerald-500/30 text-emerald-300')}">
              <i data-lucide="sparkles" class="w-6 h-6 text-emerald-600 shrink-0"></i>
              <div>
                <h3 class="text-sm font-bold">¡Ruta calibrada para tu escuela!</h3>
                <p class="text-xs leading-relaxed opacity-85">
                  Basado en ${state.entorno} (${state.ubicacion}) con alineación para ${state.cursos.join(', ')} Básico.
                </p>
              </div>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-3.5">
              ${[
                { n: 'Clase 1', t: 'El Problema en Terreno', d: 'Salida al estero, toma de muestras y medición de turbidez.' },
                { n: 'Clase 2', t: 'Construcción Maker', d: 'Calibración de sensores de bajo costo y registro de pH.' },
                { n: 'Clase 3', t: 'Análisis & Datos', d: 'Comparación con bioindicadores nativos y gráficas.' },
                { n: 'Clase 4', t: 'Impacto en la Comunidad', d: 'Entrega del reporte formal al comité APR y familias.' }
              ].map(s => `
                <div class="p-4 rounded-2xl border ${theme === 'light' ? 'bg-slate-50 border-slate-200' : (theme === 'natural' ? 'bg-[#fbf8f2] border-[#e8ded0]' : 'bg-slate-950 border-slate-800')}">
                  <span class="text-xs font-bold text-[#f97316] uppercase block mb-1">${s.n}</span>
                  <h4 class="text-sm font-bold text-slate-900 mb-1 ${theme === 'midnight' ? 'text-white' : ''}">${s.t}</h4>
                  <p class="text-xs text-slate-500 leading-relaxed ${theme === 'midnight' ? 'text-slate-400' : ''}">${s.d}</p>
                </div>
              `).join('')}
            </div>

            <div class="p-4 rounded-2xl border flex flex-col sm:flex-row items-center justify-between gap-4 ${theme === 'light' ? 'bg-white border-slate-200 shadow-sm' : (theme === 'natural' ? 'bg-white border-[#d8cebe]' : 'bg-slate-900 border-slate-800')}">
              <div class="flex items-center gap-3">
                <i data-lucide="file-text" class="w-8 h-8 text-[#f97316]"></i>
                <div>
                  <div class="text-sm font-bold">Cuaderno de Expedición (PDF Imprimible)</div>
                  <div class="text-xs text-slate-500">Incluye 4 hojas de campo, rúbricas y carta a las familias.</div>
                </div>
              </div>

              <button type="button" class="px-5 py-2 rounded-full bg-[#f97316] hover:bg-orange-600 text-white font-bold text-xs shadow-md transition cursor-pointer whitespace-nowrap">
                Descargar Documentos
              </button>
            </div>
          </div>
        `;
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      render();
    });
  </script>
</body>
</html>
